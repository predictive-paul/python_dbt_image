# Publish when a version tag is pushed (or via workflow_dispatch).
# Local bump: python3 build.py --bump patch && git push origin HEAD && git push origin vX.Y.Z
#
# Git tags:
#   v0.1.0     → image :0.1.0 (+ :latest)
#   dbt_0.1.0  → same (pi_docker-style {image}_{version})
#
# Destinations:
#   ghcr.io/<owner>/<repo>/dbt:<version>  (+ :latest)
#   europe-west1-docker.pkg.dev/pi-storage-258815/pi/dbt:<version>  (+ :latest)
#
# GCP auth (optional; GHCR still publishes without it):
#   WIF:  vars.GCP_WORKLOAD_IDENTITY_PROVIDER + vars.GCP_SERVICE_ACCOUNT
#   Key:  secrets.GCP_SERVICE_KEY
name: Build image

on:
  push:
    tags:
      - "v*"
      - "*_*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version to build (e.g. 0.1.0 or v0.1.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: dbt
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'pi-storage-258815' }}
  AR_LOCATION: ${{ vars.AR_LOCATION || 'europe-west1' }}
  AR_REPOSITORY: ${{ vars.AR_REPOSITORY || 'pi' }}

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and registries
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          VERSION="${VERSION#v}"
          if [[ "$VERSION" == *_* ]]; then
            VERSION="${VERSION#*_}"
          fi

          OWNER_REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          AR_REGISTRY="${AR_LOCATION}-docker.pkg.dev"
          {
            echo "version=$VERSION"
            echo "ghcr_prefix=ghcr.io/${OWNER_REPO}"
            echo "ar_registry=$AR_REGISTRY"
            echo "ar_prefix=${AR_REGISTRY}/${GCP_PROJECT_ID}/${AR_REPOSITORY}"
          } >> "$GITHUB_OUTPUT"

          echo "Building ${IMAGE_NAME}:${VERSION}"
          echo "  GHCR → ghcr.io/${OWNER_REPO}/${IMAGE_NAME}"
          echo "  AR   → ${AR_REGISTRY}/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${IMAGE_NAME}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud (WIF)
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (service account key)
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' && secrets.GCP_SERVICE_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_KEY }}

      - name: Set up gcloud
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' || secrets.GCP_SERVICE_KEY != '' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' || secrets.GCP_SERVICE_KEY != '' }}
        run: gcloud auth configure-docker "${{ steps.meta.outputs.ar_registry }}" --quiet

      - name: Build, smoke-test, and push
        shell: bash
        run: |
          set -euo pipefail
          REGISTRY_ARGS=(--registry "${{ steps.meta.outputs.ghcr_prefix }}")
          if [[ -n "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}" || -n "${{ secrets.GCP_SERVICE_KEY }}" ]]; then
            REGISTRY_ARGS+=(--registry "${{ steps.meta.outputs.ar_prefix }}")
          fi
          python3 build.py \
            --name "${IMAGE_NAME}" \
            --version "${{ steps.meta.outputs.version }}" \
            --push \
            "${REGISTRY_ARGS[@]}"
